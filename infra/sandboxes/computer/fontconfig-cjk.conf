<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The image ships fonts-noto-cjk, but a bare Debian fontconfig has no mapping
  from the macOS/Windows CJK family names that real-world pages ask for. A page
  styled `font-family: "PingFang SC"` therefore resolved to DejaVu Sans, which
  has no CJK glyphs, and headless screenshots rendered every Chinese character
  as a tofu box showing its UTF-8 byte hex.

  Two things are fixed here:
    1. Strong aliases from the common macOS/Windows CJK names to the bundled
       Noto CJK faces, so an explicit request lands on a font that has glyphs.
    2. Weak appends on the generic families, so even a request that never names
       a CJK font still falls back to Noto CJK instead of DejaVu when the text
       contains Chinese/Japanese/Korean.

  Verified with `fc-match`: before, `fc-match "sans-serif:lang=zh"` returned
  DejaVuSans.ttf; after, it returns NotoSansCJK-Regular.ttc.
-->
<fontconfig>
  <!-- Explicit macOS/Windows family names -> bundled Noto CJK (Simplified). -->
  <match target="pattern">
    <test name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFang TC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hiragino Sans GB</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Heiti SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>WenQuanYi Micro Hei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- Generic families: append Noto CJK as a weak fallback so untagged text still renders. -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
</fontconfig>
