<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'"
    />
    <title>Set up Doitx</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-name">Doitx</span>
      <div class="titlebar-end">
        <select
          id="setup-locale"
          class="titlebar-select"
          aria-label="Language"
          data-i18n-aria-label="language"
        ></select>
        <button
          id="theme-toggle"
          class="icon-button theme-toggle"
          type="button"
          aria-label="Switch to light theme"
          title="Switch to light theme"
        >
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="8" cy="8" r="3.2" />
            <path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1" />
          </svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.6 5.6 0 1 0 7 7Z" />
          </svg>
        </button>
        <button
          id="quit"
          class="titlebar-quit"
          type="button"
          title="Quit Doitx"
          data-i18n="quit"
          data-i18n-title="quitTitle"
        >
          Quit
        </button>
      </div>
    </header>

    <main class="shell">
      <h1 class="heading" data-i18n="welcome">Welcome to Doitx</h1>
      <p class="subheading" data-i18n="chooseServer">Choose which server this app should use.</p>

      <form id="setup" novalidate>
        <fieldset class="choices">
          <legend class="sr-only" data-i18n="instance">Instance</legend>

          <label class="choice" for="mode-cloud">
            <input id="mode-cloud" type="radio" name="mode" value="cloud" checked />
            <span class="choice-title" data-i18n="cloud">Doitx Cloud</span>
          </label>

          <label class="choice" for="mode-new">
            <input id="mode-new" type="radio" name="mode" value="new" />
            <span class="choice-title" data-i18n="thisComputer">This computer</span>
          </label>

          <label class="choice" for="mode-existing">
            <input id="mode-existing" type="radio" name="mode" value="existing" />
            <span class="choice-title" data-i18n="existingInstance">Existing instance</span>
          </label>
        </fieldset>

        <section id="panel-new" class="panel">
          <div id="stack" hidden>
            <div class="stack-head">
              <p id="stack-phase" class="stack-phase" role="status" aria-live="polite"></p>
              <button
                id="stack-details"
                class="icon-button"
                type="button"
                aria-controls="stack-output"
                aria-expanded="false"
                aria-label="Technical details"
                title="Technical details"
                data-i18n-aria-label="technicalDetails"
                data-i18n-title="technicalDetails"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="M3.5 4.5 7 8l-3.5 3.5M8.5 11.5H13" />
                </svg>
              </button>
            </div>
            <div
              id="stack-progress"
              class="progress"
              role="progressbar"
              aria-label="Setup progress"
              data-i18n-aria-label="setupProgress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              hidden
            >
              <div id="stack-progress-fill" class="progress-fill"></div>
            </div>
            <p id="stack-detail" class="stack-detail"></p>
            <pre id="stack-output" class="stack-output" hidden></pre>
            <div id="stack-docker-help" class="stack-help" hidden>
              <button class="link" type="button" data-link="docker-desktop">Docker Desktop</button>
              <button class="link" type="button" data-link="orbstack">OrbStack</button>
              <button class="link" type="button" data-link="docker-engine">Docker Engine</button>
            </div>
          </div>
        </section>

        <section id="panel-existing" class="panel" hidden>
          <label class="field-label" for="server-url" data-i18n="serverAddress">Server address</label>
          <input
            id="server-url"
            class="field"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="https://rakazo.example.com"
          />
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="actions">
          <button id="check" class="button button-secondary" type="button" data-i18n="checkConnection">
            Check connection
          </button>
          <button id="continue" class="button button-primary" type="submit" data-i18n="continue">
            Continue
          </button>
        </div>
      </form>
    </main>

    <script src="setup-i18n.js"></script>
    <script src="setup.js"></script>
  </body>
</html>
